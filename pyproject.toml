# Tooling config only (the project is run from the repo folder, not installed as a package).
[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["data", "logs", "runs", "tradingview"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import order, B bugbear (likely bugs), UP modern syntax,
# S security (the Bandit rules), DTZ naive datetimes (time-zone bugs matter in a trading system).
select = ["E", "W", "F", "I", "B", "UP", "S", "DTZ"]
ignore = [
    "S101",   # assert is used on purpose in tests and self-checks
    "E501",   # long lines are handled by line-length; docs tables in strings may exceed
    "E702", "E701", "E731",  # compact one-liners are a deliberate house style in this repo
    "E741",   # short names like `l` for a bar's low are conventional in OHLC code
    "B905",   # zip(strict=) - inputs here are built side by side from the same list
    "B007",   # unused loop variables in retry loops
    "DTZ011", # date.today(): the bot runs on one PC; roll/startup dates use its local date on purpose
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "DTZ", "B"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true      # ib_async / databento ship partial or no stubs
check_untyped_defs = true
warn_unused_ignores = true
exclude = ["^data/", "^logs/", "^runs/", "^tests/"]

